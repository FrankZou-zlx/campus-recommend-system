# ============================================================
#  校园二手优选 · 一键部署编排（MySQL + 后端 API + Nginx 前端）
#
#  用法（在项目根目录，也就是有本文件的地方执行）：
#     cp .env.example .env      # 首次：改掉里面的密码
#     docker compose up -d      # 构建并后台启动
#     docker compose ps         # 看状态
#     docker compose logs -f    # 看日志
#     docker compose down       # 停止（数据保留在 volume 里）
#     docker compose down -v    # 停止并删除数据卷（慎用）
#
#  访问：http://<服务器IP>/        正式站
#        http://<服务器IP>/demo/   免后端的公开演示版
# ============================================================

services:
  # ---------------- 数据库 ----------------
  db:
    image: mysql:8.0
    container_name: campus-db
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      # mysql2 驱动在非 TLS 连接下用这个认证插件最省事
      - --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root1234}
      MYSQL_DATABASE: ${DB_NAME:-campus_mall}
      MYSQL_USER: ${DB_USER:-campus}
      MYSQL_PASSWORD: ${DB_PASSWORD:-campus1234}
      TZ: Asia/Shanghai
    volumes:
      - db_data:/var/lib/mysql
      # 首次启动（数据卷为空时）自动执行建表语句
      - ./deploy/mysql/init.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    networks: [campus]

  # ---------------- 后端 API ----------------
  api:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.backend
    image: campus-mall-api:latest
    container_name: campus-api
    restart: unless-stopped
    environment:
      PORT: 3001
      DB_HOST: db                 # 直接用服务名，compose 内部 DNS 解析
      DB_PORT: 3306
      DB_USER: ${DB_USER:-campus}
      DB_PASSWORD: ${DB_PASSWORD:-campus1234}
      DB_NAME: ${DB_NAME:-campus_mall}
      JWT_SECRET: ${JWT_SECRET:-please-change-this-secret}
      # 同源部署（前端由 Nginx 代理 /api），这里填服务器地址即可
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-http://localhost}
      TZ: Asia/Shanghai
    volumes:
      # 商品图片持久化：容器重建不丢图
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    networks: [campus]

  # ---------------- 前端（Nginx）----------------
  web:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.frontend
    image: campus-mall-web:latest
    container_name: campus-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-80}:80"
    depends_on:
      - api
    networks: [campus]

volumes:
  db_data:
  uploads:

networks:
  campus:
    driver: bridge
