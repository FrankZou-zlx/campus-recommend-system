# ============================================================
#  校园二手优选 · Nginx 站点配置（裸机部署）
#  安装位置：/etc/nginx/conf.d/campus-mall.conf
#
#  root 指向前端静态目录（免构建，vendor/ 里已内置 vue / element-plus / axios）
#  /api 与 /uploads 反向代理给本机 3001 端口上的 Node 后端
#
#  改完记得：nginx -t && systemctl reload nginx
# ============================================================
server {
    listen       80;
    listen       [::]:80;
    server_name  _;                       # 有域名就换成你的域名，如 campus.example.com

    root   /opt/campus-mall/frontend;
    index  index.html;

    charset utf-8;

    # 发布商品可上传多张图片
    client_max_body_size 20m;

    access_log /var/log/nginx/campus-mall.access.log;
    error_log  /var/log/nginx/campus-mall.error.log warn;

    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 4;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # ---------- 后端接口 ----------
    # ^~ ：命中该前缀后不再尝试正则 location，避免被静态资源规则截走
    location ^~ /api/ {
        proxy_pass         http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ---------- 商品图片（后端 express.static 提供）----------
    location ^~ /uploads/ {
        proxy_pass       http://127.0.0.1:3001;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public";
    }

    # ---------- 公开演示版（可选，目录 /opt/campus-mall/demo）----------
    # 用 root 而非 alias：alias 与 try_files 组合在 Nginx 里有已知的路径计算问题
    location ^~ /demo/ {
        root  /opt/campus-mall;
        index index.html;
        try_files $uri $uri/ /demo/index.html;
    }

    # ---------- 静态资源 ----------
    # 图片 / 字体：很少变动（uploads 的文件名自带时间戳），可以强缓存
    location ~* \.(png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    # JS / CSS：**不能强缓存**
    # 前端在持续迭代，一旦被浏览器缓存 7 天，改完代码用户拿到的还是旧文件，
    # 表现为"点了没反应 / 功能不对"，且刷新也没用（本项目踩过这个坑）。
    # expires -1 → 每次带 If-Modified-Since 回服务器校验，没变才走 304，开销可忽略。
    location ~* \.(js|css)$ {
        expires -1;
        access_log off;
    }

    # ---------- 前端页面（单页应用，未知路径回落 index.html）----------
    location / {
        try_files $uri $uri/ /index.html;
        # 入口 HTML 不缓存：它决定了加载哪个版本的 app.js，必须每次取最新
        add_header Cache-Control "no-store";
    }
}
