# ============================================================
#  容器内 Nginx 站点配置：前端静态 + 后端接口反向代理
#  /api/     -> api 容器（Express，默认 3001）
#  /uploads/ -> api 容器（商品图片，由后端 express.static 提供）
#  同源访问，所以前端不需要跨域配置
# ============================================================
server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    charset utf-8;

    # 发布商品可上传多张图片，放宽请求体上限
    client_max_body_size 20m;

    # 访问日志（docker logs 里也看得到）
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 4;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # ---------- 后端接口 ----------
    # ^~ 表示前缀匹配后不再尝试正则 location，避免被下面的静态资源规则抢走
    location ^~ /api/ {
        proxy_pass         http://api:3001;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ---------- 商品图片 ----------
    location ^~ /uploads/ {
        proxy_pass       http://api:3001;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public";
    }

    # ---------- 静态资源 ----------
    # 图片 / 字体可强缓存；JS / CSS 必须每次校验（否则前端更新用户拿不到）
    location ~* \.(png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    location ~* \.(js|css)$ {
        expires -1;
        access_log off;
    }

    # ---------- 前端页面（单页应用，未知路径回落到 index.html）----------
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store";
    }
}
