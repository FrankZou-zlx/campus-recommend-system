# Render 免费部署配置（后端）
# 在 Render 控制台「New → Web Service → Connect 本仓库」后，
# Render 会自动读取此文件；下面 sync:false 的变量需在 Render 面板手动填写。
services:
  - type: web
    name: campus-mall-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3001"
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "3306"
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        value: campus_mall
      - key: JWT_SECRET
        sync: false
      - key: CLIENT_ORIGIN
        sync: false
